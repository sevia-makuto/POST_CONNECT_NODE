<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h1>Testing Node.js CORS</h1>

    <button onclick="testCors()">Test Backend</button>

    <pre id="result"></pre>

    <script>
        async function testCors() {
            try {
                const response = await fetch(
                    "http://localhost:3000/",
                    {
                        credentials: "include"
                    }
                );

                const data = await response.text();

                document.getElementById("result").textContent =
                    `Status: ${response.status}\n${data}`;

            } catch (error) {
                document.getElementById("result").textContent =
                    error.message;
            }
        }
    </script>
</body>
</html>
